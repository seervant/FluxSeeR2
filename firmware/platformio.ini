; ============================================================================
;  FleXSeeR2 - прошивка настольного ночника FluXSeeR
;  Версия прошивки: 0.011.21.1   |   Версия железа: 0.011.21
;
;  Контроллер: ESP32-S3-DevKitC-1 (Liludin), модуль ESP32-S3-WROOM-1-N16R8
;  (16 МБ Quad flash + 8 МБ Octal PSRAM -> GPIO35/36/37 заняты внутренней шиной)
; ============================================================================

[platformio]
; ---------------------------------------------------------------------------
;  КАТАЛОГ СБОРКИ ВНЕ ПРОЕКТА (обязательно для этого проекта)
;
;  Линковщик ESP32 (riscv32-esp-elf-ld) использует ANSI-функции Windows и
;  не умеет работать с путями, содержащими не-ASCII символы. Каталог проекта
;  содержит кириллицу ("Моя работка\Ночники"), и сборка падала на этапе
;  линковки с ошибкой:
;      ld.exe: cannot open map file .../firmware/.pio/build/flexeer/firmware.map
;
;  Каталог сборки вынесен в ASCII-путь - проблема исчезает полностью.
;  Если проект переедет в папку без кириллицы, секцию [platformio] можно убрать.
; ---------------------------------------------------------------------------
build_dir = ${sysenv.USERPROFILE}\.platformio\build_flexeer

[env:flexeer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Настройка памяти под N16R8 (Quad flash + Octal PSRAM) ---
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; --- Загрузка и отладочный порт ---
; Serial выводится через НАТИВНЫЙ USB (разъём "USB" на плате).
; Второй разъём "UART" - мост CH343, он же используется для прошивки.
monitor_speed = 115200
upload_speed = 921600

; --- Библиотеки ---
lib_deps =
    fastled/FastLED @ ^3.9.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9